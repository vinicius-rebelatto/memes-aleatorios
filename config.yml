# Configuração do bot de memes.
# Depois de editar, é só salvar (commit): a próxima execução já usa a configuração nova.

# Horários dos memes (horário de Brasília). Use aspas.
# O bot acorda de hora em hora e só posta quando está dentro da janela de um horário
# e o meme daquele horário ainda não saiu. Se ele acordar atrasado mais que a
# tolerância, pula aquele horário em vez de postar fora de hora.
agenda:
  horarios: [
      "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00",
      "18:00", "19:00", "20:00", "21:00", "22:00", "23:00", "00:00", "01:00", "02:00"
    ]
  tolerancia_minutos: 120

# De onde vêm os memes: categorias, cada uma com seus subreddits.
#
# Como o bot escolhe:
#   1. sorteia a CATEGORIA: as com nível perto da régua (🌶️ sobe, 🚫 desce) e que levam
#      mais 😂/👍 do que 😐 saem mais. Sem `nivel`, a categoria fica fora da régua.
#   2. dentro dela, sorteia o SUBREDDIT: os que levam 😂/👍 se sobressaem e os que levam
#      😐 vão sumindo (até ~20x menos chance).
#   `peso` dá um empurrão fixo (padrão 1): 2 = o dobro de chance, 0.5 = metade.
#   Cada subreddit pode ter seu próprio `peso` e `nivel`, como o dankmemes abaixo.
categorias:
  "🇧🇷 Brasileiros":
    nivel: 4
    peso: 1.5
    fontes: [MemesBrasil, MemesBR, eu_nvr, circojeca, HUEstation, DiretoDoZapZap]

  "💀 Humor pesado":
    nivel: 5
    fontes:
      - HolUp
      - darkmemers
      - subreddit: dankmemes
        nivel: 4
      - subreddit: 2meirl4meirl
        nivel: 4

  "😂 Gerais":
    nivel: 2
    fontes: [memes, me_irl, BikiniBottomTwitter, funny, wholesomememes]

  "🌀 Absurdos":
    nivel: 3
    fontes: [surrealmemes, comedyheaven, ComedyCemetery]

  "👴 Memes de velho":
    nivel: 2
    fontes: [OldPeopleFacebook, terriblefacebookmemes, boomershumor]

  "🎮 Jogos":
    peso: 0.6
    fontes: [LeagueOfMemes, MinecraftMemes, PhoenixSC, GameMemes, Gamingcirclejerk]

  "🤓 Nerd":
    peso: 0.4
    fontes: [HistoryMemes, ProgrammerHumor, PrequelMemes]

# Filtros de qualidade, valem para todas as fontes.
qualidade:
  # Meme com menos votos que isso no Reddit não sai (corta post fraco e sem graça).
  votos_minimos: 30
  # Meme com uma dessas palavras no título não sai (desenhos e fan art não são meme).
  bloquear: ["c.eed", "fanart", "fan art", "my art", "i drew", "commission", "speedpaint"]

# As reações que o bot coloca em cada meme.
reacoes:
  engracado: "😂" # vale voto no Meme da Semana e faz a fonte aparecer mais
  curti: "👍" # gostei, mesmo sem ser de rir: vale igual ao 😂
  sem_graca: "😐" # faz a fonte aparecer menos
  mais_pesado: "🌶️" # sobe a régua
  passou_do_ponto: "🚫" # desce a régua (e com votos suficientes apaga o meme)

termometro:
  # Onde a régua começa: 1 = leve ... 5 = pesado. Só vale antes dos primeiros votos;
  # depois quem manda é a galera (o valor atual fica em dados/termometro.json).
  regua_inicial: 4
  # Chance de um post ignorar a régua e sortear qualquer fonte (0.2 = 20%); os 😂 e 😐
  # continuam valendo. Serve para o algoritmo não ficar viciado e perceber quando o gosto muda.
  surpresa: 0.2

nsfw:
  # Memes marcados como NSFW no Reddit podem sair, contando como +1 de peso na régua.
  # Só vale se o canal estiver marcado como "restrito por idade" no Discord (regra
  # do Discord para conteúdo adulto). Sem essa marcação, NSFW fica de fora.
  permitir: true

moderacao:
  # Quantas pessoas precisam marcar 🚫 para o bot apagar o meme.
  votos_para_remover: 3

ranking:
  # Quando sai o Meme da Semana (horário de Brasília).
  dia: domingo
  horario: "21:00"
  # Quantos dias para trás a votação considera.
  dias: 7
  # Quantas posições aparecem no anúncio (🥇🥈🥉).
  quantidade: 3
  # Memes que a galera posta no canal também concorrem?
  incluir_posts_da_galera: true

estoque:
  # Pasta com memes que a própria galera sobe no repositório.
  pasta: estoque
  # Chance de o post sair do estoque (0.2 = 20%), se tiver meme novo lá.
  # Se o Reddit falhar, o estoque vira o plano B automaticamente.
  chance: 0.2

# Endereço do Worker dos comandos: o bot consulta o que o /meme já mandou para não repetir.
worker: https://memes-aleatorios.vinicius-rebelatto.workers.dev
