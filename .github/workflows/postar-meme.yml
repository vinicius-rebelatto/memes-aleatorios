name: Postar meme

# O bot acorda de hora em hora: modera, posta se for horário (agenda no config.yml)
# e anuncia o Meme da Semana no dia certo. Ele mesmo confere o horário, então acordar
# atrasado ou duas vezes não faz ele postar fora de hora nem repetir.
#
# Quem acorda o bot:
# - o relógio do Worker da Cloudflare (passo 6 do README), que é pontual;
# - o agendamento abaixo, de reserva (o do GitHub anda atrasando horas);
# - o botão "Run workflow", que por padrão posta um meme na hora.

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      modo:
        description: "agora = posta um meme já · agenda = só posta se for horário · ranking = Meme da Semana já · simular = só testa"
        type: choice
        options: [agora, agenda, ranking, simular]
        default: agora

permissions:
  contents: write # para salvar o histórico e o termômetro no repositório

concurrency:
  group: bot-de-memes
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MODO: ${{ inputs.modo || 'agenda' }}
        run: python -m bot.postar --modo "$MODO"

      - name: Salvar histórico e termômetro
        # roda mesmo se algo falhar, para não perder o que já foi feito
        if: ${{ !cancelled() && inputs.modo != 'simular' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi
          git commit -m "🤖 Bot de memes"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
