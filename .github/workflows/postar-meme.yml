name: Postar meme

on:
  schedule:
    # 11h17, 16h17 e 21h17 no horário de Brasília.
    # O minuto "quebrado" foge do horário de pico do GitHub (início de cada hora).
    - cron: "17 11,16,21 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (testa as fontes e mostra o meme escolhido, sem postar)"
        type: boolean
        default: false

permissions:
  contents: write # para salvar o histórico e o termômetro no repositório

concurrency:
  group: postar-meme
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Simular
        if: ${{ inputs.simular }}
        run: python -m bot.postar --simular

      - name: Postar meme
        if: ${{ !inputs.simular }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m bot.postar

      - name: Salvar histórico e termômetro
        # roda mesmo se o post falhar, para não perder os votos já contados
        if: ${{ !cancelled() && !inputs.simular }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi
          git commit -m "🤖 Meme postado"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
