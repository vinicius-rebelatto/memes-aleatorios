name: Moderar memes

on:
  schedule:
    # De hora em hora: apaga os memes que levaram 🚫 da galera.
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write # para salvar o termômetro quando um meme é removido

concurrency:
  group: moderar-memes
  cancel-in-progress: true

jobs:
  moderar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Apagar memes que passaram do ponto
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m bot.moderar

      - name: Salvar termômetro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "🚫 Meme removido pela galera"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
