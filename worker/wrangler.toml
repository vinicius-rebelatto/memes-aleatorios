# Worker da Cloudflare que atende os comandos do Discord (/meme, /termometro e /ajuda)
# e acorda o bot de hora em hora. Quem publica é o GitHub Actions (workflow
# "Comandos do Discord"): não precisa rodar nada.
name = "memes-aleatorios"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Valores públicos (não são segredo): a chave pública do app e o painel que o bot salva.
DISCORD_PUBLIC_KEY = "d4ee3f3a986a63e9a23c88ec2503f124acd70ce9dd7a0a889fe7be23e08c58c2"
PAINEL_URL = "https://raw.githubusercontent.com/vinicius-rebelatto/memes-aleatorios/main/dados/painel.json"
REPOSITORIO = "vinicius-rebelatto/memes-aleatorios"
# O token do relógio (RELOGIO_GITHUB_TOKEN) é secret: o workflow guarda ele no Worker.

# Memória do /meme: o que ele já mandou (para não repetir), guardada por 30 dias.
[[kv_namespaces]]
binding = "JA_ENVIADOS"
id = "c92dc01eaf814a9fb48df69ff1329098"

# O relógio: no minuto 0 de cada hora o Worker acorda o bot no GitHub Actions.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
